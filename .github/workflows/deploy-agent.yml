name: Deploy LiveKit Voice Agent

# Auto-deploys the Aiva voice agent (aiva-voice-agent/) to LiveKit Cloud
# whenever code touching the agent is pushed to main. Mirrors the Vercel
# behavior you already have for the Next.js app: push -> build -> deploy.
on:
  push:
    branches:
      - main
    paths:
      - 'aiva-voice-agent/**'
      - '.github/workflows/deploy-agent.yml'
  workflow_dispatch: # allow manual deploys from the Actions tab

jobs:
  deploy-agent:
    runs-on: ubuntu-latest
    environment: aiva-voice-agent
    concurrency:
      group: deploy-agent-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Deploy LiveKit Cloud agent
        id: deploy
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ secrets.SECRET_LIST }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: aiva-voice-agent

      - name: Wait for agent to be healthy
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        with:
          OPERATION: status-retry
          WORKING_DIRECTORY: aiva-voice-agent
          TIMEOUT: 5m
